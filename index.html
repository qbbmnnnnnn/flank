<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noty · 纵向便签 Dock</title>
  <style>
    :root {
      color-scheme: dark;
      --dock-width: 76px;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Segoe UI", sans-serif;
      background: #11131a;
    }

    button, textarea, input { font: inherit; }

    body {
      color: rgba(255,255,255,.92);
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 154, 194, .24), transparent 31%),
        radial-gradient(circle at 80% 72%, rgba(83, 91, 255, .26), transparent 38%),
        linear-gradient(135deg, #141727 0%, #23223a 45%, #10121d 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .35;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.07'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .desktop {
      position: relative;
      width: 100%;
      height: 100%;
      isolation: isolate;
    }

    .menubar {
      height: 34px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 500;
      background: rgba(14, 15, 24, .38);
      border-bottom: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(28px) saturate(1.3);
      -webkit-backdrop-filter: blur(28px) saturate(1.3);
    }

    .menu-left, .menu-right { display: flex; align-items: center; gap: 18px; }
    .menu-left strong { font-size: 16px; }
    .menu-right { gap: 11px; color: rgba(255,255,255,.82); }

    .workspace-copy {
      position: absolute;
      left: clamp(28px, 7vw, 112px);
      top: clamp(88px, 16vh, 170px);
      max-width: 560px;
      user-select: none;
    }

    .eyebrow {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      margin-bottom: 20px;
      padding: 7px 11px;
      color: rgba(255,255,255,.65);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 99px;
      background: rgba(255,255,255,.05);
      backdrop-filter: blur(14px);
    }

    .eyebrow::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffd85e;
      box-shadow: 0 0 12px #ffd85e;
    }

    h1 {
      margin: 0;
      max-width: 520px;
      font-size: clamp(46px, 7vw, 92px);
      line-height: .95;
      letter-spacing: -.065em;
      font-weight: 650;
    }

    h1 span { color: rgba(255,255,255,.36); }

    .workspace-copy p {
      width: min(440px, 75vw);
      margin: 26px 0 0;
      color: rgba(255,255,255,.55);
      font-size: 15px;
      line-height: 1.7;
    }

    .hint {
      position: absolute;
      left: clamp(28px, 7vw, 112px);
      bottom: 42px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: rgba(255,255,255,.4);
      font-size: 12px;
    }

    .hint kbd {
      padding: 4px 8px;
      border: 1px solid rgba(255,255,255,.14);
      border-bottom-color: rgba(255,255,255,.25);
      border-radius: 6px;
      color: rgba(255,255,255,.68);
      background: rgba(255,255,255,.07);
      box-shadow: inset 0 -1px rgba(0,0,0,.22);
    }

    .edge-glow {
      position: fixed;
      z-index: 5;
      right: -56px;
      top: 50%;
      width: 100px;
      height: 62vh;
      border-radius: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,.08);
      filter: blur(34px);
      pointer-events: none;
    }

    .dock-shell {
      position: fixed;
      z-index: 20;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      perspective: 700px;
    }

    .dock {
      position: relative;
      width: 70px;
      padding: 8px 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }

    .dock::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: 24px;
      right: -8px;
      width: 54px;
      height: 540px;
      border-radius: 32px 0 0 32px;
      background: rgba(8, 10, 20, .24);
      filter: blur(18px);
      transform: translateX(-6px);
      pointer-events: none;
    }

    .dock-item {
      position: relative;
      width: 96px;
      height: 114px;
      flex: 0 0 114px;
      display: grid;
      place-items: center;
      margin-right: -22px;
      border: 0;
      padding: 0;
      color: #24232a;
      background: transparent;
      cursor: pointer;
      transform-origin: right center;
      will-change: transform;
      -webkit-tap-highlight-color: transparent;
    }

    .dock-item[data-title] { transform: rotate(var(--tilt, 0deg)); }
    .dock-item[data-title] + .dock-item[data-title] { margin-top: -9px; }
    .dock-item[data-title]:nth-child(1) { --tilt: -1.8deg; margin-right: -54px; z-index: 1; }
    .dock-item[data-title]:nth-child(2) { --tilt: .9deg; margin-right: -51px; z-index: 2; }
    .dock-item[data-title]:nth-child(3) { --tilt: -1.1deg; margin-right: -57px; z-index: 3; }
    .dock-item[data-title]:nth-child(4) { --tilt: 1.25deg; margin-right: -52px; z-index: 4; }
    .dock-item[data-title]:nth-child(5) { --tilt: -1.35deg; margin-right: -55px; z-index: 5; }
    .dock-item[data-title]:hover,
    .dock-item[data-title].is-focused { z-index: 12; }

    .note-icon {
      position: relative;
      width: 96px;
      height: 114px;
      overflow: hidden;
      border-radius: 18px 0 0 18px;
      background: var(--paper);
      box-shadow:
        -10px 10px 20px rgba(0,0,0,.28),
        -3px 3px 6px rgba(0,0,0,.14),
        inset 0 1px rgba(255,255,255,.62);
      transition: filter .2s ease, box-shadow .24s ease;
    }

    .dock-item:hover .note-icon {
      filter: brightness(1.045);
      box-shadow:
        -16px 14px 28px rgba(0,0,0,.32),
        -3px 3px 7px rgba(0,0,0,.14),
        inset 0 1px rgba(255,255,255,.68);
    }

    .note-icon::before {
      content: "";
      position: absolute;
      z-index: 2;
      top: 10px;
      right: 50%;
      bottom: 10px;
      border-right: 1px dashed rgba(72,58,43,.2);
    }

    .note-icon::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(145deg, rgba(255,255,255,.3), transparent 38%, rgba(0,0,0,.05));
      pointer-events: none;
    }

    .note-lines { display: none; }

    .dock-item[data-title] .dock-label {
      position: absolute;
      z-index: 3;
      left: 0;
      top: 9px;
      bottom: 9px;
      width: 38px;
      display: grid;
      place-items: center;
      writing-mode: vertical-rl;
      text-orientation: upright;
      white-space: nowrap;
      color: rgba(42,38,36,.78);
      font-size: 14px;
      font-weight: 750;
      letter-spacing: .08em;
      pointer-events: none;
    }

    .note-actions {
      position: absolute;
      z-index: 5;
      top: 0;
      right: 8px;
      bottom: 0;
      width: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .action-icon {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: rgba(50,44,41,.64);
      cursor: pointer;
      opacity: 0;
      transform: translateX(7px) scale(.92);
      pointer-events: none;
      transition: color .18s ease, background .18s ease, box-shadow .2s ease, transform .2s var(--ease), opacity .16s ease;
    }

    .dock-item.stage-actions .action-icon {
      opacity: 1;
      transform: translateX(0) scale(1);
      pointer-events: auto;
    }

    .action-icon svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .dock-item.stage-actions .action-icon:hover { color: rgba(255,255,255,.96); transform: translateX(0) scale(1.06); }
    .action-icon[data-action="archive"]:hover {
      background: #5b92e8;
      box-shadow: 0 4px 16px rgba(58,123,230,.7), 0 0 0 1px rgba(255,255,255,.18) inset;
    }
    .action-icon[data-action="delete"]:hover {
      background: #ef6262;
      box-shadow: 0 4px 16px rgba(235,65,65,.7), 0 0 0 1px rgba(255,255,255,.18) inset;
    }

    .dock-action .dock-label {
      position: absolute;
      right: calc(100% + 12px);
      top: 50%;
      padding: 7px 10px;
      transform: translate(8px, -50%);
      white-space: nowrap;
      color: white;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      background: rgba(20,20,26,.8);
      box-shadow: 0 8px 22px rgba(0,0,0,.25);
      backdrop-filter: blur(12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease, transform .2s var(--ease);
    }

    .dock-action.is-focused .dock-label {
      opacity: 1;
      transform: translate(0, -50%);
    }

    .separator {
      width: 54px;
      height: 1px;
      margin: 8px 0 6px;
      background: rgba(255,255,255,.18);
    }

    .dock-action {
      width: 64px;
      height: 52px;
      flex-basis: 52px;
      margin-right: -10px;
    }

    .dock-action .note-icon {
      display: grid;
      width: 58px;
      height: 48px;
      place-items: center;
      border: 1px solid rgba(255,255,255,.18);
      border-right: 0;
      border-radius: 17px 0 0 17px;
      color: rgba(255,255,255,.84);
      background: rgba(245,246,250,.2);
      box-shadow: -5px 7px 18px rgba(0,0,0,.18), inset 0 1px rgba(255,255,255,.16);
      backdrop-filter: blur(18px);
    }

    .dock-action .note-icon::before { display: none; }
    .dock-action svg { width: 22px; height: 22px; stroke-width: 1.8; }

    .editor-card {
      position: fixed;
      z-index: 25;
      right: 108px;
      top: 50%;
      width: min(380px, calc(100vw - 145px));
      height: min(490px, 72vh);
      padding: 0;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 20px;
      color: #2c2930;
      background: var(--editor-paper, #ffe78a);
      box-shadow: 0 34px 90px rgba(0,0,0,.36), inset 0 1px rgba(255,255,255,.66);
      transform: translate(36px, -50%) scale(.88);
      transform-origin: right center;
      opacity: 0;
      visibility: hidden;
    }

    .editor-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(145deg, rgba(255,255,255,.26), transparent 26%, rgba(107,73,25,.05));
    }

    .editor-toolbar {
      position: relative;
      z-index: 1;
      height: 64px;
      padding: 0 15px 0 19px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(70,55,30,.11);
    }

    .editor-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: rgba(45,39,34,.52); }
    .editor-meta b { color: rgba(45,39,34,.82); font-size: 13px; }

    .close-btn {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: rgba(40,35,31,.58);
      background: rgba(255,255,255,.22);
      cursor: pointer;
      transition: background .18s ease, transform .18s ease;
    }

    .close-btn:hover { background: rgba(255,255,255,.38); transform: scale(1.06); }
    .close-btn svg { width: 17px; height: 17px; }

    .editor-title, .editor-body {
      position: relative;
      z-index: 1;
      width: 100%;
      border: 0;
      outline: 0;
      resize: none;
      color: #29262b;
      background: transparent;
    }

    .editor-title {
      height: 74px;
      padding: 20px 22px 8px;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -.035em;
    }

    .editor-body {
      height: calc(100% - 128px);
      padding: 8px 22px 24px;
      font-size: 15px;
      line-height: 1.75;
    }

    .editor-title::placeholder, .editor-body::placeholder { color: rgba(45,39,34,.4); }

    .editor-toolbar-title {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      color: #29262b;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: -.025em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .editor-actions { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; }
    .editor-icon-btn {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: rgba(40,35,31,.58);
      background: rgba(255,255,255,.22);
      cursor: pointer;
      transition: background .18s ease, transform .18s ease;
    }
    .editor-icon-btn:hover { background: rgba(255,255,255,.42); transform: scale(1.06); }
    .editor-icon-btn svg { width: 16px; height: 16px; }
    .editor-preview {
      position: relative;
      z-index: 1;
      height: calc(100% - 64px);
      padding: 18px 22px 30px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(70,55,30,.22) transparent;
    }
    .editor-preview-title {
      margin: 0 0 18px;
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: -.035em;
    }
    .editor-preview-body { color: #363139; font-size: 17px; line-height: 1.85; overflow-wrap: anywhere; }
    .editor-preview-body h1, .editor-preview-body h2, .editor-preview-body h3 { margin: 19px 0 8px; line-height: 1.3; }
    .editor-preview-body h1 { font-size: 23px; }
    .editor-preview-body h2 { font-size: 20px; }
    .editor-preview-body h3 { font-size: 17px; }
    .preview-paragraph { min-height: 1.7em; margin: 2px 0; }
    .preview-task, .preview-list-item { display: flex; align-items: flex-start; gap: 9px; margin: 5px 0; }
    .preview-list-dot { flex: 0 0 5px; width: 5px; height: 5px; margin: 10px 5px 0 6px; border-radius: 50%; background: currentColor; opacity: .58; }
    .preview-check {
      flex: 0 0 19px;
      width: 19px;
      height: 19px;
      margin-top: 6px;
      padding: 0;
      display: grid;
      box-sizing: border-box;
      place-items: center;
      border: 1.6px solid rgba(54,48,53,.48);
      border-radius: 6px;
      color: white;
      background: rgba(255,255,255,.2);
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
    }
    .preview-check:hover { transform: scale(1.08); border-color: #3d985c; }
    .preview-check.is-checked { border-color: #3d985c; background: #4cab69; }
    .preview-check.is-checked::after { content: "✓"; font-size: 13px; font-weight: 800; line-height: 1; }
    .preview-task.is-done .preview-task-copy { opacity: .55; text-decoration: line-through; }
    .editor-preview-body blockquote { margin: 8px 0; padding-left: 12px; border-left: 3px solid rgba(54,48,53,.3); color: rgba(54,48,53,.72); }
    .editor-preview-body code { padding: 2px 5px; border-radius: 5px; background: rgba(255,255,255,.28); font-family: "Cascadia Code", Consolas, monospace; font-size: .9em; }
    .editor-preview-body a { color: #315f9f; text-decoration-thickness: 1px; text-underline-offset: 2px; }

    .create-backdrop {
      position: fixed;
      z-index: 28;
      inset: 34px 0 0;
      display: grid;
      place-items: center;
      padding: 24px 110px 24px 24px;
      background: rgba(8, 10, 18, .48);
      backdrop-filter: blur(16px) saturate(.9);
      -webkit-backdrop-filter: blur(16px) saturate(.9);
      opacity: 0;
      visibility: hidden;
    }

    .create-dialog {
      width: min(680px, calc(100vw - 150px));
      max-height: calc(100vh - 82px);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 24px;
      color: #27242d;
      background: #f8f7f4;
      box-shadow: 0 38px 110px rgba(0,0,0,.46), inset 0 1px #fff;
      transform: translateY(18px) scale(.96);
    }

    .create-header {
      min-height: 72px;
      padding: 0 22px 0 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(35,31,42,.09);
    }

    .create-heading { display: flex; align-items: center; gap: 13px; }
    .create-heading-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      color: #55420d;
      background: #ffe57a;
      box-shadow: 0 6px 15px rgba(120,86,0,.16), inset 0 1px rgba(255,255,255,.7);
    }
    .create-heading-mark svg { width: 19px; height: 19px; }
    .create-heading h2 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
    .create-heading p { margin: 3px 0 0; color: #85808c; font-size: 12px; }

    .create-form { overflow: auto; max-height: calc(100vh - 240px); }
    .create-main { padding: 26px 28px 20px; }
    .create-title {
      width: 100%;
      padding: 0 0 15px;
      border: 0;
      border-bottom: 1px solid rgba(35,31,42,.1);
      outline: 0;
      color: #26232b;
      background: transparent;
      font-size: 29px;
      font-weight: 720;
      letter-spacing: -.04em;
    }
    .create-title::placeholder, .create-body::placeholder { color: #aaa6ae; }
    .create-body-wrap { position: relative; margin-top: 16px; }
    .create-body {
      width: 100%;
      min-height: 158px;
      padding: 2px 0 42px;
      border: 0;
      outline: 0;
      resize: vertical;
      color: #3e3944;
      background: transparent;
      font-size: 15px;
      line-height: 1.75;
    }
    .insert-task {
      position: absolute;
      left: 0;
      bottom: 3px;
      height: 31px;
      padding: 0 11px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid rgba(43,38,48,.11);
      border-radius: 9px;
      color: #625c68;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(32,28,38,.05);
      transition: transform .18s ease, border-color .18s ease;
    }
    .insert-task:hover { transform: translateY(-1px); border-color: rgba(43,38,48,.24); }
    .task-box { width: 14px; height: 14px; border: 1.5px solid #77717e; border-radius: 4px; }

    .create-meta {
      padding: 20px 28px 22px;
      display: grid;
      grid-template-columns: 1.05fr 1fr 1.05fr;
      gap: 20px;
      background: #efeeeb;
      border-top: 1px solid rgba(35,31,42,.07);
    }
    .meta-field { min-width: 0; }
    .meta-label {
      margin-bottom: 9px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #77717d;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .meta-label svg { width: 14px; height: 14px; }
    .date-field {
      width: 100%;
      height: 38px;
      padding: 0 10px;
      border: 1px solid rgba(43,38,48,.12);
      border-radius: 10px;
      outline: 0;
      color: #4a4550;
      background: #fbfaf8;
    }
    .date-field:focus { border-color: #7a69e8; box-shadow: 0 0 0 3px rgba(122,105,232,.12); }
    .choice-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .choice-chip {
      min-height: 38px;
      padding: 0 10px;
      border: 1px solid rgba(43,38,48,.1);
      border-radius: 10px;
      color: #6f6975;
      background: #fbfaf8;
      cursor: pointer;
    }
    .choice-chip:hover { border-color: rgba(43,38,48,.24); }
    .choice-chip.is-selected {
      color: #433b64;
      border-color: rgba(102,83,211,.38);
      background: #ebe7ff;
      box-shadow: inset 0 0 0 1px rgba(102,83,211,.06);
    }
    .priority-chip { flex: 1; padding: 0 7px; }
    .priority-chip[data-value="重要"].is-selected { color: #744c00; border-color: #e2b44b; background: #fff2c9; }
    .priority-chip[data-value="紧急"].is-selected { color: #912f35; border-color: #e78a90; background: #ffe1e3; }

    .create-footer {
      min-height: 70px;
      padding: 0 24px 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(35,31,42,.09);
      background: #f8f7f4;
    }
    .create-shortcut { color: #98939d; font-size: 11px; }
    .create-shortcut kbd { padding: 3px 6px; border: 1px solid #d8d5da; border-radius: 5px; background: #fff; color: #6e6873; }
    .footer-actions { display: flex; gap: 9px; }
    .dialog-btn {
      height: 38px;
      padding: 0 17px;
      border: 0;

    }
    .dialog-btn.secondary { color: #716b76; background: transparent; }

    .dialog-btn.primary { color: #fff; background: #6255ce; box-shadow: 0 8px 20px rgba(75,60,180,.24); }
    .dialog-btn.primary:hover { background: #5549bd; transform: translateY(-1px); }

    /* Quick capture: reuse the original paper editor and keep creation deliberately minimal. */
    .create-backdrop {
      place-items: center end;
      padding: 24px 108px 24px 24px;
      background: rgba(8,10,18,.32);
      backdrop-filter: blur(10px) saturate(.95);

    .create-dialog {
      position: relative;
      width: min(380px, calc(100vw - 145px));
      height: min(560px, 78vh);
      display: flex;
      flex-direction: column;

      border: 1px solid rgba(255,255,255,.34);
      border-radius: 20px;
      color: #2c2930;
      background: var(--create-paper, #ffe57a);

      transform-origin: right center;
      transition: background .24s ease;
    }
    .create-dialog::before { display: none; }
    .quick-create-toolbar {
      position: relative;
      z-index: 1;
      height: 56px;
      flex: 0 0 56px;
      padding: 0 14px 0 19px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(70,55,30,.11);
    }
    .quick-create-label { display: flex; align-items: center; gap: 9px; white-space: nowrap; }
    .quick-create-label b { font-size: 13px; }
    .quick-create-label > span:not(.autosave-status) { color: rgba(45,39,34,.5); font-size: 11px; }
    .autosave-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(45,39,34,.58);
      font-size: 11px;
      font-weight: 650;
      opacity: 1;
      visibility: visible;
      transition: opacity .18s ease, visibility .18s ease;
    }
    .autosave-status[data-state="idle"],
    .autosave-status[data-state="typing"] { opacity: 0; visibility: hidden; }
    .autosave-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: rgba(45,39,34,.28); }
    .autosave-status[data-state="saving"]::before { background: #4e7fc9; animation: autosave-pulse .7s ease-in-out infinite alternate; }
    .autosave-status[data-state="saved"]::before { background: #3e9b5d; }
    @keyframes autosave-pulse { to { opacity: .35; transform: scale(.72); } }
    .color-palette { display: flex; align-items: center; gap: 7px; margin-left: auto; }
    .color-palette.is-locked { display: none; }
    .color-swatch {
      width: 18px;
      height: 18px;
      padding: 0;
      border: 2px solid rgba(255,255,255,.62);
      border-radius: 50%;
      background: var(--swatch);
      box-shadow: 0 0 0 1px rgba(49,42,35,.16);
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease;
    }
    .color-swatch:hover { transform: scale(1.16); }
    .color-swatch.is-selected { box-shadow: 0 0 0 2px rgba(43,38,35,.7), 0 0 0 4px rgba(255,255,255,.45); transform: scale(.88); }
    .quick-create-title, .quick-create-body {
      position: relative;
      z-index: 1;
      width: 100%;
      border: 0;
      outline: 0;
      resize: none;
      color: #29262b;
      background: transparent;
    }
    .quick-create-title {
      height: 78px;
      flex: 0 0 78px;
      padding: 20px 22px 10px;
      font-size: 27px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -.035em;
    }
    .quick-body-shell {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 0;
    }
    .quick-create-body {
      position: absolute;
      inset: 0;
      height: 100%;
      padding: 10px 22px 20px;
      overflow-y: auto;
      font-size: 17px;
      line-height: 1.85;
      white-space: normal;
      scrollbar-width: thin;
      scrollbar-color: rgba(70,55,30,.28) transparent;
    }
    .quick-create-body.is-empty::before {
      content: attr(data-placeholder);
      position: absolute;
      left: 22px;
      top: 10px;
      color: rgba(45,39,34,.4);
      pointer-events: none;
    }
    .editor-line {
      min-height: 31.45px;
      display: block;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .editor-line.is-task {
      display: grid;
      grid-template-columns: 19px minmax(0, 1fr);
      align-items: start;
      gap: 9px;
    }
    .editor-line-copy { min-width: 0; outline: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    .editor-task-box {
      width: 19px;
      height: 19px;
      margin-top: 6px;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      border: 1.6px solid rgba(54,48,53,.5);
      border-radius: 6px;
      color: #fff;
      background: transparent;
      cursor: pointer;
    }
    .editor-task-box.is-checked { border-color: #3d985c; background: #4cab69; }
    .editor-task-box.is-checked::after { content: "✓"; font-size: 13px; font-weight: 800; line-height: 1; }
    .quick-create-title::placeholder { color: rgba(45,39,34,.4); }
    .markdown-bar {
      position: relative;
      z-index: 1;
      min-height: 54px;
      flex: 0 0 54px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid rgba(70,55,30,.1);
      background: rgba(255,255,255,.12);
    }
    .format-tools { display: flex; align-items: center; gap: 5px; }
    .format-btn {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      color: rgba(43,38,42,.66);
      background: transparent;
      cursor: pointer;
      font-weight: 750;
    }
    .format-btn:hover { color: #29242a; background: rgba(255,255,255,.36); }
    .format-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .format-separator { width: 1px; height: 20px; margin: 0 3px; background: rgba(70,55,30,.13); }
    .markdown-hint { color: rgba(45,39,34,.5); font-size: 10px; white-space: nowrap; }

    /* The note rail scrolls independently; utility buttons reveal only in context. */
    .dock-shell { width: 112px; }
    .dock { width: 112px; padding: 8px 0; gap: 0; }
    .dock::before { right: -8px; }
    .note-scroll {
      width: 112px;
      max-height: calc(100vh - 228px);
      padding: 10px 0 12px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      scrollbar-width: none;
      scroll-behavior: smooth;
      mask-image: linear-gradient(to bottom, transparent 0, #000 12px, #000 calc(100% - 14px), transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 12px, #000 calc(100% - 14px), transparent 100%);
    }
    .note-scroll::-webkit-scrollbar { display: none; }
    .note-scroll .dock-item[data-title] { margin-right: -54px; }
    .dock-item[data-title] .dock-label {
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dock-grab-zone {
      width: 100%;
      height: 38px;
      flex: 0 0 38px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
    }
    .dock.controls-visible .dock-grab-zone,
    .dock.is-dragging .dock-grab-zone { pointer-events: auto; }
    .drag-handle {
      width: 48px;
      height: 32px;
      margin-right: 8px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 11px;
      color: rgba(255,255,255,.72);
      background: rgba(245,246,250,.2);
      box-shadow: 0 8px 22px rgba(0,0,0,.24), inset 0 1px rgba(255,255,255,.2);
      backdrop-filter: blur(18px);
      cursor: grab;
      touch-action: none;
    }
    .drag-handle:hover { color: rgba(255,255,255,.96); background: rgba(245,246,250,.28); }
    .drag-handle:active, .dock.is-dragging .drag-handle { cursor: grabbing; }
    .drag-handle-dots {
      width: 16px;
      display: grid;
      grid-template-columns: repeat(2, 4px);
      grid-template-rows: repeat(3, 4px);
      justify-content: space-between;
      gap: 3px 0;
    }
    .drag-handle-dots i {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 1px 2px rgba(0,0,0,.2);
    }
    .dock-controls {
      width: 100%;
      padding-top: 2px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      opacity: 0;
      transform: translateX(18px);
      pointer-events: none;
    }
    .dock.controls-visible:not(.is-dragging) .dock-controls { pointer-events: auto; }
    .dock-controls .separator { margin-right: 0; }
    .dock-controls .dock-action { opacity: 0; }
    .dock-action:hover .dock-label {
      opacity: 1;
      transform: translate(0, -50%);
    }
    #addNote, #settings { width: 58px; margin-right: -4px; }
    #addNote .note-icon, #settings .note-icon {
      width: 48px;
      height: 48px;
      border-right: 1px solid rgba(255,255,255,.18);
      border-radius: 50%;
    }

    /* The rail turns into a loose stack of square notes while it is being carried. */
    .dock-shell.is-dragging { z-index: 50; }
    .dock-shell.is-dragging .dock::before { opacity: .45; }
    .dock-shell.is-dragging .note-scroll {
      mask-image: none;
      -webkit-mask-image: none;
    }
    .dock-shell.is-dragging .dock-item[data-title] {
      width: 96px;
      height: 96px;
      flex-basis: 96px;
      margin: -4px 0 0 !important;
    }
    .dock-shell.is-dragging .dock-item[data-title] .note-icon {
      width: 96px;
      height: 96px;
      border-radius: 16px;
      animation: carried-note-wiggle .22s ease-in-out infinite alternate;
    }
    .dock-shell.is-dragging .dock-item[data-title]:nth-child(2n) .note-icon { animation-delay: -.11s; }
    .dock-shell.is-dragging .dock-item[data-title]:nth-child(3n) .note-icon { animation-delay: -.055s; }
    .dock-shell.is-dragging .dock-item[data-title] .dock-label {
      inset: 0;
      width: auto;
      writing-mode: horizontal-tb;
      text-orientation: mixed;
      letter-spacing: .04em;
    }
    .dock-shell.is-dragging .note-icon::before,
    .dock-shell.is-dragging .note-actions { display: none; }
    .dock.is-dragging .dock-controls { opacity: 0 !important; visibility: hidden; pointer-events: none; }

    @keyframes carried-note-wiggle {
      from { transform: rotate(-2deg) translate3d(-1px, 0, 0); }
      to { transform: rotate(2deg) translate3d(1px, -1px, 0); }
    }

    body.dock-on-left .edge-glow { left: -56px; right: auto; }
    .dock-shell.dock-left .dock { align-items: flex-start; }
    .dock-shell.dock-left .note-scroll { align-items: flex-start; }
    .dock-shell.dock-left .note-scroll .dock-item[data-title] {
      margin-right: 0 !important;
      margin-left: -54px;
      transform-origin: left center;
    }
    .dock-shell.dock-left .dock-item[data-title] .note-icon { border-radius: 0 18px 18px 0; }
    .dock-shell.dock-left .dock-item[data-title] .dock-label { left: auto; right: 0; }
    .dock-shell.dock-left .note-actions { left: 8px; right: auto; }
    .dock-shell.dock-left .dock-grab-zone { justify-content: flex-start; }
    .dock-shell.dock-left .dock-controls { align-items: flex-start; }
    .dock-shell.dock-left .drag-handle {
      margin-right: 0;
      margin-left: 8px;
    }
    .dock-shell.dock-left .dock-controls .separator { margin-left: 0; }
    .dock-shell.dock-left #addNote,
    .dock-shell.dock-left #settings { margin-right: 0; margin-left: -4px; }
    .dock-shell.dock-left .dock-action .dock-label {
      right: auto;
      left: calc(100% + 12px);
      transform: translate(-8px, -50%);
    }
    .dock-shell.dock-left .dock-action:hover .dock-label { transform: translate(0, -50%); }

    /* Side-specific dock rules must not leak into the detached carrying state. */
    .dock-shell.dock-left.is-dragging .dock,
    .dock-shell.dock-left.is-dragging .note-scroll { align-items: flex-end; }
    .dock-shell.dock-left.is-dragging .note-scroll .dock-item[data-title] {
      width: 96px;
      height: 96px;
      flex-basis: 96px;
      margin: -4px 0 0 !important;
      transform-origin: center;
    }
    .dock-shell.dock-left.is-dragging .dock-item[data-title] .note-icon {
      width: 96px;
      height: 96px;
      border-radius: 16px;
    }
    .dock-shell.dock-left.is-dragging .dock-item[data-title] .dock-label {
      inset: 0;
      left: 0;
      right: 0;
      width: auto;
    }
    body.dock-on-left .editor-card { left: 108px; right: auto; transform-origin: left center; }

    .toast {
      position: fixed;
      z-index: 40;
      left: 50%;
      bottom: 30px;
      padding: 10px 14px;
      transform: translate(-50%, 12px);
      color: rgba(255,255,255,.9);
      font-size: 13px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 11px;
      background: rgba(18,18,24,.72);
      box-shadow: 0 14px 42px rgba(0,0,0,.26);
      backdrop-filter: blur(18px);
      opacity: 0;
      visibility: hidden;
    }

    @media (max-height: 720px) {
      .dock-item[data-title] { height: 88px; flex-basis: 88px; }
      .dock-item[data-title] + .dock-item[data-title] { margin-top: -7px; }
      .dock-item[data-title] .note-icon { height: 88px; border-radius: 15px 0 0 15px; }
      .dock-shell.dock-left .dock-item[data-title] .note-icon { border-radius: 0 15px 15px 0; }
      .dock-shell.is-dragging .dock-item[data-title],
      .dock-shell.is-dragging .dock-item[data-title] .note-icon { height: 88px; width: 88px; flex-basis: 88px; border-radius: 15px; }
      .dock-item[data-title] .dock-label { font-size: 12px; letter-spacing: .02em; }
      .dock::before { height: 400px; }
      .dock { gap: 0; }
      .note-scroll { max-height: calc(100vh - 194px); gap: 1px; }
    }

    @media (max-width: 680px) {
      .workspace-copy { top: 100px; }
      .workspace-copy p { max-width: calc(100vw - 130px); }
      .editor-card { right: 94px; width: calc(100vw - 112px); }
      .dock-shell { right: 0; }
      .menu-left span:not(:first-of-type) { display: none; }
      .create-backdrop { padding: 12px 78px 12px 12px; }
      .create-dialog { width: calc(100vw - 90px); height: min(540px, calc(100vh - 58px)); border-radius: 18px; }
      .quick-create-label > span:not(.autosave-status), .markdown-hint { display: none; }
      .color-palette { gap: 5px; }
      .color-swatch { width: 16px; height: 16px; }
    }

    @media (max-width: 500px) {
      .quick-create-toolbar { padding: 0 10px; gap: 6px; }
      .quick-create-label { gap: 5px; }
      .autosave-status { gap: 4px; }
      .color-palette { gap: 4px; }
      .color-swatch { width: 14px; height: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
      .dock-shell.is-dragging .dock-item[data-title] .note-icon { animation: none; }
    }
  </style>
</head>
<body>
  <main class="desktop">
    <header class="menubar" aria-label="模拟 macOS 菜单栏">

    <section class="workspace-copy" aria-labelledby="page-title">
      <div class="eyebrow">Experimental interface · 01</div>

      <p>把光标移到屏幕右侧的便签栏。它会像 macOS Dock 一样感知距离、放大当前便签，并带动相邻项目。</p>

          <span class="note-icon" style="--paper:#A9E5D1"><span class="note-lines"><i></i><i></i><i></i></span><span class="note-actions"><span class="action-icon" data-action="archive" title="归档"><svg viewBox="0 0 24 24"><path d="M4 7h16v13H4zM3 4h18v3H3zM9 11h6"/></svg></span><span class="action-icon" data-action="delete" title="删除"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg></span></span></span>

        </div>

          <span class="note-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>

        </button>
        <button class="dock-item dock-action" id="settings" aria-label="设置">
          <span class="note-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.17.38.38.73.6 1 .28.34.67.54 1.1.6H21v4h-.09A1.7 1.7 0 0 0 19.4 15Z"/></svg></span>
          <span class="dock-label">设置</span>
        </button>
        </div>
      </nav>
    </aside>

    <article class="editor-card" id="editor" aria-hidden="true">
      <div class="editor-toolbar">
        <h2 class="editor-toolbar-title" id="editorPreviewTitle"></h2>
        <div class="editor-actions">
          <button class="editor-icon-btn" id="editNote" aria-label="编辑便签" title="编辑"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg></button>
          <button class="close-btn" id="closeEditor" aria-label="关闭便签"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
        </div>

      <div class="editor-preview" id="editorPreview">
        <div class="editor-preview-body" id="editorPreviewBody"></div>

    <div class="create-backdrop" id="createBackdrop" aria-hidden="true">
      <section class="create-dialog" id="createDialog" role="dialog" aria-modal="true" aria-labelledby="createTitleLabel">
        <header class="quick-create-toolbar">
          <div class="quick-create-label"><b id="createTitleLabel">新便签</b><span>Markdown</span><span class="autosave-status" id="autosaveStatus" data-state="idle" role="status" aria-live="polite">自动保存</span></div>
          <div class="color-palette" id="colorPalette" aria-label="选择便签颜色">
            <button class="color-swatch is-selected" type="button" data-color="#FFE57A" style="--swatch:#FFE57A" aria-label="柠檬黄"></button>
            <button class="color-swatch" type="button" data-color="#FFB8A7" style="--swatch:#FFB8A7" aria-label="蜜桃粉"></button>
            <button class="color-swatch" type="button" data-color="#F5B8CD" style="--swatch:#F5B8CD" aria-label="玫瑰粉"></button>
            <button class="color-swatch" type="button" data-color="#D8C1FF" style="--swatch:#D8C1FF" aria-label="丁香紫"></button>
            <button class="color-swatch" type="button" data-color="#AED6FF" style="--swatch:#AED6FF" aria-label="天空蓝"></button>
            <button class="color-swatch" type="button" data-color="#A9E5D1" style="--swatch:#A9E5D1" aria-label="薄荷绿"></button>
          </div>
          <button class="close-btn" id="closeCreate" aria-label="关闭新建便签"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
        </header>
        <input class="quick-create-title" id="newTitle" maxlength="28" placeholder="标题" aria-label="便签标题" />
        <div class="quick-body-shell">
          <div class="quick-create-body" id="newBody" role="textbox" aria-multiline="true" aria-label="便签内容，支持 Markdown" data-placeholder="写点什么… 支持 Markdown，也可以从下方插入勾选事项。"></div>
        </div>
        <footer class="markdown-bar" aria-label="Markdown 快捷工具栏">
          <div class="format-tools">
            <button class="format-btn" id="insertTask" type="button" title="勾选事项"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m7.5 12 3 3 6-7"/></svg></button>
            <span class="format-separator"></span>
            <button class="format-btn" type="button" data-format="heading" title="标题">H</button>
            <button class="format-btn" type="button" data-format="bold" title="粗体">B</button>
            <button class="format-btn" type="button" data-format="italic" title="斜体"><i>I</i></button>
            <button class="format-btn" type="button" data-format="list" title="列表"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
            <button class="format-btn" type="button" data-format="code" title="行内代码">&lt;/&gt;</button>
          </div>
          <span class="markdown-hint">停止输入后自动保存</span>
        </footer>
      </section>
    </div>

    <div class="toast" id="toast" role="status"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script>
    (() => {
      const dockShell = document.querySelector('.dock-shell');
      const dock = document.querySelector('.dock');
      const noteScroll = document.querySelector('#noteScroll');
      const dockControls = document.querySelector('.dock-controls');
      const dockGrabZone = document.querySelector('.dock-grab-zone');
      const dragHandle = document.querySelector('#dragHandle');
      const items = [...document.querySelectorAll('.note-scroll .dock-item')];
      const noteItems = [...document.querySelectorAll('.dock-item[data-title]')];
      const editor = document.querySelector('#editor');
      const previewTitle = document.querySelector('#editorPreviewTitle');
      const previewBody = document.querySelector('#editorPreviewBody');
      const editNoteButton = document.querySelector('#editNote');
      const closeButton = document.querySelector('#closeEditor');
      const toast = document.querySelector('#toast');
      const createBackdrop = document.querySelector('#createBackdrop');
      const createDialog = document.querySelector('#createDialog');
      const newTitle = document.querySelector('#newTitle');
      const newBody = document.querySelector('#newBody');
      const colorPalette = document.querySelector('#colorPalette');
      const colorSwatches = [...document.querySelectorAll('.color-swatch')];
      const autosaveStatus = document.querySelector('#autosaveStatus');
      const createTitleLabel = document.querySelector('#createTitleLabel');
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let editorOpen = false;
      let createOpen = false;
      let activeNote = null;
      let editingNote = null;
      let draftNote = null;
      let selectedColor = '#FFE57A';
      let autosaveTimer;
      let autosaveStatusTimer;
      let toastTween;
      let isDraggingDock = false;
      let dragOrigin = null;
      let dockSide = 'right';
      const hoverTimers = new WeakMap();

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
      const mapRange = (inMin, inMax, outMin, outMax, value) => {
        const progress = clamp((value - inMin) / (inMax - inMin), 0, 1);
        return outMin + (outMax - outMin) * progress;
      };

      const animators = items.map((item) => ({
        scale: gsap.quickTo(item, 'scale', { duration: reduceMotion ? 0 : .34, ease: 'power3.out' }),
        x: gsap.quickTo(item, 'x', { duration: reduceMotion ? 0 : .34, ease: 'power3.out' })
      }));

      const inwardDirection = () => dockSide === 'left' ? 1 : -1;

      function resetDock() {
        items.forEach((item, index) => {
          clearTimeout(hoverTimers.get(item));
          item.classList.remove('is-focused', 'stage-peek', 'stage-actions');
          animators[index].scale(1);
          animators[index].x(item.classList.contains('active') ? 20 * inwardDirection() : 0);
        });
      }

      dock.addEventListener('pointermove', (event) => {
        if (isDraggingDock) return;
        let closest = { item: null, distance: Infinity };
        const hoveredItem = event.target.closest('.dock-item');

        items.forEach((item, index) => {
          const rect = item.getBoundingClientRect();
          const centerY = rect.top + rect.height / 2;
          const distance = Math.abs(event.clientY - centerY);
          const influence = clamp(1 - distance / 132, 0, 1);
          const scale = 1 + influence * .14;
          const direction = inwardDirection();
          let x = mapRange(0, 1, 0, 24 * direction, influence);
          if (item.classList.contains('active')) x += 20 * direction;

          if (item === hoveredItem && item.dataset.title) {
            x = mapRange(0, 1, 0, 4 * direction, influence);
            x += (item.classList.contains('stage-actions') ? 42 : 20) * direction;
          }

          animators[index].scale(scale);
          animators[index].x(x);

          if (distance < closest.distance) closest = { item, distance };
        });

        items.forEach((item) => item.classList.toggle('is-focused', item === closest.item && closest.distance < 58));
      });

      function showDockControls() {
        if (isDraggingDock) return;
        dock.classList.add('controls-visible');
        gsap.killTweensOf([dockGrabZone, dragHandle, dockControls, '.dock-controls .dock-action']);
        gsap.to(dockGrabZone, { autoAlpha: 1, y: 0, duration: reduceMotion ? 0 : .18, ease: 'power2.out' });
        gsap.fromTo(dragHandle,
          { autoAlpha: 0, y: 24, scale: .82 },
          { autoAlpha: 1, y: 0, scale: 1, duration: reduceMotion ? 0 : .42, ease: 'back.out(1.9)' }
        );
        gsap.to(dockControls, { autoAlpha: 1, x: 0, duration: reduceMotion ? 0 : .18, ease: 'power2.out' });
        gsap.fromTo('.dock-controls .dock-action',
          { autoAlpha: 0, y: -30, scale: .76 },
          { autoAlpha: 1, y: 0, scale: 1, duration: reduceMotion ? 0 : .42, stagger: .12, delay: reduceMotion ? 0 : .08, ease: 'back.out(1.9)' }
        );
      }

      function hideDockControls() {
        if (isDraggingDock) return;
        dock.classList.remove('controls-visible');
        gsap.killTweensOf([dockGrabZone, dragHandle, dockControls, '.dock-controls .dock-action']);
        gsap.to(dragHandle, { autoAlpha: 0, y: 12, scale: .88, duration: reduceMotion ? 0 : .14, ease: 'power2.in' });
        gsap.to(dockGrabZone, { autoAlpha: 0, y: 12, duration: reduceMotion ? 0 : .16, delay: reduceMotion ? 0 : .04, ease: 'power2.in' });
        gsap.to('.dock-controls .dock-action', { autoAlpha: 0, y: -12, scale: .88, duration: reduceMotion ? 0 : .14, stagger: .025, ease: 'power2.in' });
        gsap.to(dockControls, { autoAlpha: 0, x: 12 * -inwardDirection(), duration: reduceMotion ? 0 : .16, delay: reduceMotion ? 0 : .04, ease: 'power2.in' });
      }

      noteScroll.addEventListener('pointerenter', showDockControls);
      dock.addEventListener('pointerleave', () => {
        if (isDraggingDock) return;
        resetDock();
        hideDockControls();
      });

      function beginDockDrag(event) {
        if (event.button !== 0 || isDraggingDock) return;
        event.preventDefault();
        const rect = dockShell.getBoundingClientRect();
        isDraggingDock = true;
        dragOrigin = {
          pointerId: event.pointerId,
          pointerX: event.clientX,
          pointerY: event.clientY,
          left: rect.left,
          top: rect.top,
          x: 0,
          y: 0
        };
        closeEditor();
        if (createOpen) closeCreate();
        resetDock();
        gsap.killTweensOf([dockShell, dockControls, '.dock-controls .dock-action']);
        dockShell.style.left = `${rect.left}px`;
        dockShell.style.right = 'auto';
        dockShell.style.top = `${rect.top}px`;
        dockShell.style.transform = 'none';
        dockShell.classList.add('is-dragging');
        dock.classList.add('is-dragging');
        dragHandle.setAttribute('aria-pressed', 'true');
        document.body.style.userSelect = 'none';
        document.body.style.cursor = 'grabbing';
        gsap.to(dockControls, { autoAlpha: 0, scale: .86, duration: reduceMotion ? 0 : .16, ease: 'power2.in' });
        gsap.to(dockGrabZone, { autoAlpha: 1, y: 0, duration: reduceMotion ? 0 : .16 });
        dragHandle.setPointerCapture(event.pointerId);
      }

      function moveDock(event) {
        if (!isDraggingDock || event.pointerId !== dragOrigin.pointerId) return;
        const maxLeft = Math.max(0, innerWidth - dockShell.offsetWidth);
        const maxTop = Math.max(8, innerHeight - dockShell.offsetHeight - 8);
        const nextLeft = clamp(dragOrigin.left + event.clientX - dragOrigin.pointerX, 0, maxLeft);
        const nextTop = clamp(dragOrigin.top + event.clientY - dragOrigin.pointerY, 8, maxTop);
        dragOrigin.x = nextLeft - dragOrigin.left;
        dragOrigin.y = nextTop - dragOrigin.top;
        gsap.set(dockShell, { x: dragOrigin.x, y: dragOrigin.y });
      }

      function finishDockDrag(event) {
        if (!isDraggingDock || event.pointerId !== dragOrigin.pointerId) return;
        const currentLeft = dragOrigin.left + dragOrigin.x;
        const currentTop = dragOrigin.top + dragOrigin.y;
        const shellWidth = dockShell.offsetWidth;
        const shellHeight = dockShell.offsetHeight;
        const pointerX = Number.isFinite(event.clientX) ? event.clientX : currentLeft + shellWidth / 2;
        const nextSide = pointerX < innerWidth / 2 ? 'left' : 'right';
        const targetLeft = nextSide === 'left' ? 0 : Math.max(0, innerWidth - shellWidth);
        const targetTop = clamp(currentTop, 8, Math.max(8, innerHeight - shellHeight - 8));

        gsap.to(dockShell, {
          x: targetLeft - dragOrigin.left,
          y: targetTop - dragOrigin.top,
          duration: reduceMotion ? 0 : .34,
          ease: 'back.out(1.28)',
          overwrite: true,
          onComplete: () => {
            dockSide = nextSide;
            dockShell.classList.toggle('dock-left', dockSide === 'left');
            document.body.classList.toggle('dock-on-left', dockSide === 'left');
            dockShell.style.left = dockSide === 'left' ? '0px' : 'auto';
            dockShell.style.right = dockSide === 'right' ? '0px' : 'auto';
            dockShell.style.top = `${targetTop}px`;
            gsap.set(dockShell, { x: 0, y: 0 });
            dockShell.classList.remove('is-dragging');
            dock.classList.remove('is-dragging');
            dragHandle.setAttribute('aria-pressed', 'false');
            document.body.style.userSelect = '';
            document.body.style.cursor = '';
            isDraggingDock = false;
            dragOrigin = null;
            resetDock();
            showDockControls();
            showToast(nextSide === 'left' ? '便签栏已吸附到左侧' : '便签栏已吸附到右侧');
          }
        });
      }

      dragHandle.addEventListener('pointerdown', beginDockDrag);
      addEventListener('pointermove', moveDock);
      addEventListener('pointerup', finishDockDrag);
      addEventListener('pointercancel', finishDockDrag);
      dragHandle.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        event.preventDefault();
        const nextSide = dockSide === 'right' ? 'left' : 'right';
        dockSide = nextSide;
        dockShell.classList.toggle('dock-left', nextSide === 'left');
        document.body.classList.toggle('dock-on-left', nextSide === 'left');
        dockShell.style.left = nextSide === 'left' ? '0px' : 'auto';
        dockShell.style.right = nextSide === 'right' ? '0px' : 'auto';
        resetDock();
        showToast(nextSide === 'left' ? '便签栏已吸附到左侧' : '便签栏已吸附到右侧');
      });
      addEventListener('resize', () => {
        if (isDraggingDock || !dockShell.style.top) return;
        const top = clamp(parseFloat(dockShell.style.top) || 8, 8, Math.max(8, innerHeight - dockShell.offsetHeight - 8));
        dockShell.style.top = `${top}px`;
      });

      const escapeHTML = (value) => value.replace(/[&<>"]/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
      })[character]);

      function renderInlineMarkdown(value) {
        let output = escapeHTML(value);
        output = output.replace(/`([^`]+)`/g, '<code>$1</code>');
        output = output.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        output = output.replace(/~~([^~]+)~~/g, '<del>$1</del>');
        output = output.replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
        output = output.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
        return output;
      }

      function renderMarkdown(body) {
        const lines = body.split('\n');
        previewBody.innerHTML = lines.map((line, index) => {
          const task = line.match(/^\s*(☐|☑)\s?(.*)$/) || line.match(/^\s*-\s*\[([ xX])\]\s?(.*)$/);
          if (task) {
            const checked = task[1] === '☑' || /x/i.test(task[1]);
            const copy = task[2] || '';
            return `<div class="preview-task${checked ? ' is-done' : ''}"><button class="preview-check${checked ? ' is-checked' : ''}" data-task-line="${index}" aria-label="${checked ? '标记为未完成' : '标记为完成'}"></button><span class="preview-task-copy">${renderInlineMarkdown(copy)}</span></div>`;
          }
          const heading = line.match(/^(#{1,3})\s+(.*)$/);
          if (heading) return `<h${heading[1].length}>${renderInlineMarkdown(heading[2])}</h${heading[1].length}>`;
          const list = line.match(/^\s*[-*+]\s+(.*)$/);
          if (list) return `<div class="preview-list-item"><span class="preview-list-dot"></span><span>${renderInlineMarkdown(list[1])}</span></div>`;
          const quote = line.match(/^>\s?(.*)$/);
          if (quote) return `<blockquote>${renderInlineMarkdown(quote[1])}</blockquote>`;
          return `<div class="preview-paragraph">${renderInlineMarkdown(line)}</div>`;
        }).join('');
      }

      function openNote(item) {
        const isSame = item.classList.contains('active') && editorOpen;
        activeNote = item;
        noteItems.forEach((note) => {
          const isActive = note === item;
          note.classList.toggle('active', isActive);
          const index = items.indexOf(note);
          animators[index].x(isActive ? 20 * inwardDirection() : 0);
        });
        previewTitle.textContent = item.dataset.title;
        renderMarkdown(item.dataset.body || '');
        editor.style.setProperty('--editor-paper', item.dataset.color);
        editor.setAttribute('aria-hidden', 'false');
        editorOpen = true;

        gsap.killTweensOf(editor);
        gsap.fromTo(editor,
          { autoAlpha: isSame ? 1 : 0, x: reduceMotion ? 0 : -36 * inwardDirection(), yPercent: -50, scale: reduceMotion ? 1 : .88, rotationY: reduceMotion ? 0 : 7 * inwardDirection() },
          { autoAlpha: 1, x: 0, yPercent: -50, scale: 1, rotationY: 0, duration: reduceMotion ? 0 : .48, ease: 'back.out(1.25)', overwrite: 'auto' }
        );
      }

      function closeEditor() {
        if (!editorOpen) return;
        editorOpen = false;
        editor.setAttribute('aria-hidden', 'true');
        noteItems.forEach((note) => {
          note.classList.remove('active', 'stage-peek', 'stage-actions');
          const index = items.indexOf(note);
          animators[index].x(0);
        });
        gsap.to(editor, {
          autoAlpha: 0,
          x: reduceMotion ? 0 : -30 * inwardDirection(),
          yPercent: -50,
          scale: reduceMotion ? 1 : .94,
          duration: reduceMotion ? 0 : .26,
          ease: 'power2.in',
          overwrite: 'auto'
        });
      }

      function showToast(message) {
        if (toastTween) toastTween.kill();
        toast.textContent = message;
        toastTween = gsap.timeline()
          .set(toast, { visibility: 'visible' })
          .to(toast, { autoAlpha: 1, y: 0, duration: reduceMotion ? 0 : .25, ease: 'power2.out' })
          .to(toast, { autoAlpha: 0, y: 8, duration: reduceMotion ? 0 : .22, ease: 'power2.in', delay: 1.35 });
      }

      function bindNoteItem(item) {
        item.dataset.body = (item.dataset.body || '').replace(/\\n/g, '\n');
        const label = item.querySelector('.dock-label');
        const title = item.dataset.title || '';
        const characters = Array.from(title);
        label.textContent = characters.length > 6 ? `${characters.slice(0, 5).join('')}…` : title;
        label.title = title;

        item.addEventListener('pointerenter', () => {
          if (isDraggingDock) return;
          const index = items.indexOf(item);
          clearTimeout(hoverTimers.get(item));
          item.classList.add('stage-peek');
          animators[index].x(20 * inwardDirection());

          const timer = setTimeout(() => {
            if (!item.matches(':hover') || isDraggingDock) return;
            item.classList.add('stage-actions');
            animators[index].x(42 * inwardDirection());
          }, 1000);
          hoverTimers.set(item, timer);
        });

        item.addEventListener('pointerleave', () => {
          const index = items.indexOf(item);
          clearTimeout(hoverTimers.get(item));
          item.classList.remove('stage-peek', 'stage-actions');
          animators[index].x(item.classList.contains('active') ? 20 * inwardDirection() : 0);
        });

        item.addEventListener('click', (event) => {
          if (!event.target.closest('.action-icon')) openNote(item);
        });

        item.querySelectorAll('.action-icon').forEach((icon) => {
          icon.addEventListener('click', (event) => {
            event.stopPropagation();
            const noteTitle = item.dataset.title;
            showToast(icon.dataset.action === 'archive' ? `“${noteTitle}”已归档` : `“${noteTitle}”已移到废纸篓`);
          });
        });
      }

      noteItems.forEach(bindNoteItem);

      function setAutosaveStatus(state) {
        clearTimeout(autosaveStatusTimer);
        const labels = { idle: '自动保存', typing: '自动保存', saving: '自动保存中…', saved: '已自动保存' };
        autosaveStatus.dataset.state = state;
        autosaveStatus.textContent = labels[state];
        if (state === 'saved') {
          autosaveStatusTimer = setTimeout(() => setAutosaveStatus('idle'), 1800);
        }
      }

      function scheduleAutosave() {
        if (!createOpen) return;
        clearTimeout(autosaveTimer);
        setAutosaveStatus('typing');
        autosaveTimer = setTimeout(() => saveNote(), 900);
      }

      function openCreate(item = null) {
        clearTimeout(autosaveTimer);
        editingNote = item;
        draftNote = null;
        if (editingNote) {
          newTitle.value = editingNote.dataset.title || '';
          setEditorBodyValue(editingNote.dataset.body || '');
          selectedColor = editingNote.dataset.color || '#FFE57A';
        } else {
          newTitle.value = '';
          setEditorBodyValue('');
          selectedColor = colorSwatches[Math.floor(Math.random() * colorSwatches.length)].dataset.color;
        }
        createTitleLabel.textContent = editingNote ? '编辑便签' : '新便签';
        colorPalette.classList.toggle('is-locked', Boolean(editingNote));
        colorPalette.setAttribute('aria-hidden', editingNote ? 'true' : 'false');
        colorSwatches.forEach((swatch) => {
          swatch.disabled = Boolean(editingNote);
          swatch.classList.toggle('is-selected', swatch.dataset.color === selectedColor);
        });
        setAutosaveStatus('idle');
        closeEditor();
        createOpen = true;
        createBackdrop.setAttribute('aria-hidden', 'false');
        createDialog.style.setProperty('--create-paper', selectedColor);
        newBody.scrollTop = 0;
        gsap.killTweensOf([createBackdrop, createDialog]);
        gsap.to(createBackdrop, { autoAlpha: 1, duration: reduceMotion ? 0 : .22, ease: 'power2.out' });
        gsap.fromTo(createDialog,
          { x: reduceMotion ? 0 : 34, scale: reduceMotion ? 1 : .9, rotationY: reduceMotion ? 0 : -7 },
          { x: 0, scale: 1, rotationY: 0, duration: reduceMotion ? 0 : .46, ease: 'back.out(1.22)' }
        );
        setTimeout(() => editingNote ? focusEditorLine(newBody.querySelector('.editor-line'), 0) : newTitle.focus(), reduceMotion ? 0 : 180);
      }

      function closeCreate() {
        if (!createOpen) return;
        clearTimeout(autosaveTimer);
        const savedNote = saveNote({ quiet: true });
        createOpen = false;
        createBackdrop.setAttribute('aria-hidden', 'true');
        gsap.to(createBackdrop, {
          autoAlpha: 0,
          duration: reduceMotion ? 0 : .2,
          ease: 'power2.in',
          onComplete: () => gsap.set(createDialog, { x: 34, scale: .94 })
        });
        if (savedNote) openNote(savedNote);
        editingNote = null;
        draftNote = null;
      }

      function createEditorLine(text = '', task = false, checked = false) {
        const line = document.createElement('div');
        line.className = `editor-line${task ? ' is-task' : ''}`;
        if (task) {
          const checkbox = document.createElement('span');
          checkbox.className = `editor-task-box${checked ? ' is-checked' : ''}`;
          checkbox.contentEditable = 'false';
          checkbox.setAttribute('role', 'checkbox');
          checkbox.setAttribute('aria-checked', String(checked));
          checkbox.setAttribute('aria-label', checked ? '标记为未完成' : '标记为完成');
          line.appendChild(checkbox);
        }
        const copy = document.createElement('span');
        copy.className = 'editor-line-copy';
        copy.contentEditable = 'true';
        copy.spellcheck = true;
        if (text) copy.textContent = text;
        else copy.appendChild(document.createElement('br'));
        line.appendChild(copy);
        return line;
      }

      function setEditorBodyValue(value) {
        const fragment = document.createDocumentFragment();
        value.split('\n').forEach((line) => {
          const task = line.match(/^\s*(☐|☑)\s?(.*)$/);
          fragment.appendChild(createEditorLine(task ? task[2] : line, Boolean(task), task?.[1] === '☑'));
        });
        newBody.replaceChildren(fragment);
        newBody.classList.toggle('is-empty', !value);
      }

      function getEditorBodyValue() {
        return [...newBody.querySelectorAll(':scope > .editor-line')].map((line) => {
          const copy = line.querySelector('.editor-line-copy');
          const text = (copy?.innerText || '').replace(/\n+$/g, '');
          if (!line.classList.contains('is-task')) return text;
          return `${line.querySelector('.editor-task-box').classList.contains('is-checked') ? '☑' : '☐'} ${text}`;
        }).join('\n');
      }

      function currentEditorLine() {
        const selection = getSelection();
        const node = selection.anchorNode?.nodeType === Node.TEXT_NODE ? selection.anchorNode.parentElement : selection.anchorNode;
        return node?.closest?.('.editor-line');
      }

      function lineCaretOffset(line) {
        const copy = line.querySelector('.editor-line-copy');
        const selection = getSelection();
        if (!selection.rangeCount || !copy.contains(selection.anchorNode)) return (copy.innerText || '').length;
        const range = selection.getRangeAt(0).cloneRange();
        range.selectNodeContents(copy);
        range.setEnd(selection.anchorNode, selection.anchorOffset);
        return range.toString().length;
      }

      function focusEditorLine(line, offset = 0) {
        const copy = line.querySelector('.editor-line-copy');
        if (copy.querySelector('br')) copy.replaceChildren(document.createTextNode(''));
        const node = copy.firstChild || copy.appendChild(document.createTextNode(''));
        copy.focus();
        const range = document.createRange();
        range.setStart(node, Math.min(offset, node.length));
        range.collapse(true);
        const selection = getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      }

      function insertTaskLine() {
        let line = currentEditorLine();
        if (!line) {
          const emptyLine = [...newBody.querySelectorAll(':scope > .editor-line')].find((item) => !(item.querySelector('.editor-line-copy').innerText || '').trim());
          if (emptyLine) {
            line = createEditorLine('', true);
            emptyLine.replaceWith(line);
          } else {
            line = createEditorLine('', true);
            newBody.appendChild(line);
          }
        } else if (!line.classList.contains('is-task') && !(line.querySelector('.editor-line-copy').innerText || '').trim()) {
          const replacement = createEditorLine('', true);
          line.replaceWith(replacement);
          line = replacement;
        } else {
          const next = createEditorLine('', true);
          line.after(next);
          line = next;
        }
        focusEditorLine(line);
        scheduleAutosave();
      }

      function applyMarkdown(format) {
        const line = currentEditorLine();
        if (!line) return;
        const copy = line.querySelector('.editor-line-copy');
        const selection = getSelection();
        if (format === 'heading' || format === 'list') {
          const prefix = format === 'heading' ? '## ' : '- ';
          const offset = lineCaretOffset(line);
          copy.textContent = prefix + (copy.innerText || '');
          focusEditorLine(line, offset + prefix.length);
        } else {
          const formats = { bold: ['**', '**', '粗体文字'], italic: ['*', '*', '斜体文字'], code: ['`', '`', '代码'] };
          const [prefix, suffix, placeholder] = formats[format];
          const selected = selection.toString();
          const range = selection.rangeCount ? selection.getRangeAt(0) : null;
          if (!range || !newBody.contains(range.commonAncestorContainer)) return;
          range.deleteContents();
          const node = document.createTextNode(`${prefix}${selected || placeholder}${suffix}`);
          range.insertNode(node);
          range.setStartAfter(node);
          range.collapse(true);
          selection.removeAllRanges();
          selection.addRange(range);
        }
        copy.focus();
        scheduleAutosave();
      }

      function saveNote({ quiet = true } = {}) {
        const body = getEditorBodyValue().replace(/^\n+|\n+$/g, '');
        const firstLine = body.split('\n').find((line) => line.trim()) || '';
        const derivedTitle = firstLine.replace(/^\s*(?:#{1,6}|[-*>]|☐|☑)\s*/, '').replace(/[*_`~]/g, '').slice(0, 28);
        const title = newTitle.value.trim() || derivedTitle || '未命名便签';

        if (!newTitle.value.trim() && !body) {
          setAutosaveStatus('idle');
          return null;
        }

        setAutosaveStatus('saving');
        let item = editingNote || draftNote;
        if (item) {
          item.dataset.title = title;
          item.dataset.body = body;
          if (!editingNote) {
            item.dataset.color = selectedColor;
            item.querySelector('.note-icon').style.setProperty('--paper', selectedColor);
          }
          item.setAttribute('aria-label', `打开${title}`);
          const characters = Array.from(title);
          const label = item.querySelector('.dock-label');
          label.textContent = characters.length > 6 ? `${characters.slice(0, 5).join('')}…` : title;
          label.title = title;
        } else {
          item = document.createElement('button');
          item.className = 'dock-item';
          item.dataset.title = title;
          item.dataset.body = body;
          item.dataset.color = selectedColor;
          item.setAttribute('aria-label', `打开${title}`);
          item.style.marginRight = '-54px';
          item.style.zIndex = String(noteItems.length + 1);
          item.innerHTML = `<span class="note-icon" style="--paper:${selectedColor}"><span class="note-actions"><span class="action-icon" data-action="archive" title="归档"><svg viewBox="0 0 24 24"><path d="M4 7h16v13H4zM3 4h18v3H3zM9 11h6"/></svg></span><span class="action-icon" data-action="delete" title="删除"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg></span></span></span><span class="dock-label"></span>`;
          noteScroll.prepend(item);
          items.push(item);
          noteItems.push(item);
          animators.push({
            scale: gsap.quickTo(item, 'scale', { duration: reduceMotion ? 0 : .34, ease: 'power3.out' }),
            x: gsap.quickTo(item, 'x', { duration: reduceMotion ? 0 : .34, ease: 'power3.out' })
          });
          bindNoteItem(item);
          draftNote = item;
          gsap.from(item, { x: 60, autoAlpha: 0, scale: .8, duration: reduceMotion ? 0 : .48, ease: 'back.out(1.4)' });
        }
        setAutosaveStatus('saved');
        if (!quiet) showToast(`“${title}”已自动保存`);
        return item;
      }

      colorPalette.addEventListener('click', (event) => {
        const swatch = event.target.closest('.color-swatch');
        if (!swatch || editingNote) return;
        selectedColor = swatch.dataset.color;
        createDialog.style.setProperty('--create-paper', selectedColor);
        colorSwatches.forEach((item) => item.classList.toggle('is-selected', item === swatch));
        scheduleAutosave();
      });

      document.querySelectorAll('[data-format]').forEach((button) => {
        button.addEventListener('click', () => applyMarkdown(button.dataset.format));
      });

      newTitle.addEventListener('input', scheduleAutosave);
      newBody.addEventListener('input', () => {
        newBody.classList.toggle('is-empty', !getEditorBodyValue().replace(/\n/g, '').trim());
        scheduleAutosave();
      });

      newBody.addEventListener('keydown', (event) => {
        const line = currentEditorLine();
        if (!line) return;
        const copy = line.querySelector('.editor-line-copy');
        const text = (copy.innerText || '').replace(/\n+$/g, '');
        const offset = lineCaretOffset(line);

        if (event.key === 'Enter' && !event.shiftKey && !event.ctrlKey && !event.metaKey) {
          event.preventDefault();
          if (line.classList.contains('is-task') && !text.trim()) {
            const replacement = createEditorLine('');
            line.replaceWith(replacement);
            focusEditorLine(replacement);
          } else {
            const before = text.slice(0, offset);
            const after = text.slice(offset);
            copy.textContent = before;
            if (!before) copy.appendChild(document.createElement('br'));
            const list = !line.classList.contains('is-task') && text.match(/^(\s*[-*+]\s+)/);
            const next = createEditorLine(`${list ? list[1] : ''}${after}`, line.classList.contains('is-task'));
            line.after(next);
            focusEditorLine(next, list ? list[1].length : 0);
          }
          scheduleAutosave();
        }

        if (event.key === 'Backspace' && line.classList.contains('is-task') && !text && offset === 0) {
          event.preventDefault();
          const replacement = createEditorLine('');
          line.replaceWith(replacement);
          focusEditorLine(replacement);
          scheduleAutosave();
        }
      });

      newBody.addEventListener('paste', (event) => {
        event.preventDefault();
        const text = event.clipboardData.getData('text/plain').replace(/\r/g, '');
        const line = currentEditorLine();
        if (!line || !text.includes('\n')) {
          document.execCommand('insertText', false, text);
          return;
        }
        const copy = line.querySelector('.editor-line-copy');
        const original = (copy.innerText || '').replace(/\n+$/g, '');
        const offset = lineCaretOffset(line);
        const parts = text.split('\n');
        copy.textContent = original.slice(0, offset) + parts.shift();
        let cursor = line;
        parts.forEach((part, index) => {
          const raw = index === parts.length - 1 ? part + original.slice(offset) : part;
          const task = raw.match(/^\s*(☐|☑)\s?(.*)$/);
          const next = createEditorLine(task ? task[2] : raw, Boolean(task), task?.[1] === '☑');
          cursor.after(next);
          cursor = next;
        });
        focusEditorLine(cursor, (cursor.querySelector('.editor-line-copy').innerText || '').length - original.slice(offset).length);
        scheduleAutosave();
      });

      newBody.addEventListener('pointerdown', (event) => {
        if (event.target.closest('.editor-task-box')) event.preventDefault();
      });
      newBody.addEventListener('click', (event) => {
        const checkbox = event.target.closest('.editor-task-box');
        if (!checkbox) return;
        const checked = checkbox.classList.toggle('is-checked');
        checkbox.setAttribute('aria-checked', String(checked));
        checkbox.setAttribute('aria-label', checked ? '标记为未完成' : '标记为完成');
        scheduleAutosave();
      });

      previewBody.addEventListener('click', (event) => {
        const checkbox = event.target.closest('[data-task-line]');
        if (!checkbox || !activeNote) return;
        const index = Number(checkbox.dataset.taskLine);
        const lines = (activeNote.dataset.body || '').split('\n');
        if (/^\s*☐/.test(lines[index])) lines[index] = lines[index].replace('☐', '☑');
        else if (/^\s*☑/.test(lines[index])) lines[index] = lines[index].replace('☑', '☐');
        else if (/^\s*-\s*\[\s\]/.test(lines[index])) lines[index] = lines[index].replace(/\[\s\]/, '[x]');
        else lines[index] = lines[index].replace(/\[[xX]\]/, '[ ]');
        activeNote.dataset.body = lines.join('\n');
        renderMarkdown(activeNote.dataset.body);
      });

      closeButton.addEventListener('click', closeEditor);
      editNoteButton.addEventListener('click', () => { if (activeNote) openCreate(activeNote); });
      document.querySelector('#addNote').addEventListener('click', () => openCreate());
      document.querySelector('#closeCreate').addEventListener('click', closeCreate);
      document.querySelector('#insertTask').addEventListener('click', insertTaskLine);
      createBackdrop.addEventListener('click', (event) => { if (event.target === createBackdrop) closeCreate(); });
      document.querySelector('#settings').addEventListener('click', () => showToast('已打开偏好设置'));
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') createOpen ? closeCreate() : closeEditor();
        if (createOpen && event.ctrlKey && event.key === 'Enter') {
          event.preventDefault();
          clearTimeout(autosaveTimer);
          saveNote();
        }
      });

      const updateClock = () => {
        document.querySelector('#clock').textContent = new Intl.DateTimeFormat('zh-CN', {
          hour: '2-digit', minute: '2-digit', hour12: false
        }).format(new Date());
      };
      updateClock();
      setInterval(updateClock, 30000);

      if (!reduceMotion) {
        gsap.from('.workspace-copy > *', { y: 22, autoAlpha: 0, duration: .8, stagger: .09, ease: 'power3.out' });
        gsap.from('.dock', { x: 80, autoAlpha: 0, duration: .8, delay: .18, ease: 'back.out(1.2)' });
        gsap.from('.dock-item', { x: 24, autoAlpha: 0, duration: .45, stagger: .045, delay: .38, ease: 'power3.out' });
      }
    })();
  </script>
</body>
</html>
