name: Release

# 触发方式：
#   1. 推送形如 v0.2.0 的 tag（推荐）
#   2. 手动触发（workflow_dispatch）——手动时请把 ref 选成已存在的 tag，否则 release 会用分支名
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write # 允许创建 Release
    strategy:
      fail-fast: false
      matrix:
        # windows-latest 出 NSIS/MSI，macos-latest 出 .app/.dmg，合并进同一份 latest.json
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci --include=dev

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Flank ${{ github.ref_name }}
          releaseDraft: true # 先出草稿，人工确认产物后再 Publish
          prerelease: false
          uploadUpdaterJson: true # 生成 latest.json（默认即为 true）
          updaterJsonPreferNsis: true # Windows 同时有 NSIS/MSI 时，latest.json 指向 NSIS
